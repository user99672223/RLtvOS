name: build

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'handoff/**'
      - 'laptop/**'
      - 'tools/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tests:
    name: host tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build core natively and run tests
        run: |
          set -euxo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends cmake ninja-build clang zlib1g-dev python3
          cmake -S core -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DRL_BUILD_TESTS=ON
          cmake --build build/host --parallel
          build/host/vfs_test "$PWD"
          python3 -m py_compile tools/tv.py tools/gdbremote.py laptop/assets_server.py laptop/refs/summarize.py
          for f in laptop/setup/*.sh laptop/refs/run.sh laptop/refs/guest/*.sh handoff/wait.sh; do sh -n "$f"; done

  fex-host-check:
    name: FEXCore compile check (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build vendored FEXCore (host debug configuration)
        run: |
          set -euxo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends cmake ninja-build clang python3
          cmake -S core/fex -B build/fex-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/fex-host --target FEXCore --parallel
          ls -la build/fex-host/fexcore/Source/*.a

  build:
    name: tvOS build (unsigned) → release build-${{ github.run_number }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUILD_TAG: build-${{ github.run_number }}
      RL_DEPLOYMENT_TARGET: "18.0"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          ls /Applications | grep -i xcode || true

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Build core (CMake, tvOS static libs)
        run: |
          set -euxo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          cmake --version; ninja --version
          cmake -S core -B build/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/tvos.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$RL_DEPLOYMENT_TARGET" \
            -DRL_ENABLE_FEX=OFF
          cmake --build build/core --parallel
          ls -la build/core/*.a
          lipo -info build/core/librlcore.a

      # FEXCore + rlfex for tvOS. A failure here must not cost the harness
      # build: the app is then built without FEX (the FEX line on screen says
      # "not linked") and fex-build.log is uploaded for the next round.
      - name: Build FEXCore + rlfex (CMake, tvOS static libs)
        id: fex
        run: |
          set -uxo pipefail
          status=0
          {
            cmake -S core/fex -B build/fex -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/tvos.toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$RL_DEPLOYMENT_TARGET" \
            && cmake --build build/fex --parallel --target rlfex -- -k 0
          } > fex-build.log 2>&1 || status=$?
          echo "cmake/ninja exit status: $status"
          # -k 0: keep going after a failure so one round shows every error.
          echo "errors: $(grep -c ' error: ' fex-build.log || true) in $(grep -E '^FAILED:' fex-build.log | wc -l | tr -d ' ') objects"
          grep -E ' error: |^FAILED:' fex-build.log | sort | uniq -c | sort -rn | head -80 || true
          if [ "$status" -ne 0 ]; then
            echo '--- last 120 lines of fex-build.log ---'; tail -120 fex-build.log
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One merged archive for the Xcode link step.
          test -s build/fex/rlfex-archives.txt
          cat build/fex/rlfex-archives.txt
          xargs libtool -static -o build/fex/librlfex_all.a < build/fex/rlfex-archives.txt
          lipo -info build/fex/librlfex_all.a
          ls -la build/fex/librlfex_all.a
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Generate project
        working-directory: app
        run: |
          set -euxo pipefail
          xcodegen generate
          xcodebuild -list -project RLtvOS.xcodeproj

      - name: Build
        id: xcode
        working-directory: app
        env:
          FEX_OK: ${{ steps.fex.outputs.ok }}
        run: |
          set -uxo pipefail
          build_app() { # $1 = with_fex (true|false)
            local extra_ld="" swift_conds='$(inherited)'
            if [ "$1" = "true" ]; then
              extra_ld="$GITHUB_WORKSPACE/build/fex/librlfex_all.a"
              swift_conds='$(inherited) RL_HAVE_FEX'
            fi
            rm -rf build
            xcodebuild \
              -project RLtvOS.xcodeproj \
              -scheme RLtvOS \
              -configuration Release \
              -sdk appletvos \
              -destination 'generic/platform=tvOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              RL_BUILD_TAG="$BUILD_TAG" \
              CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
              ONLY_ACTIVE_ARCH=NO \
              OTHER_LDFLAGS="\$(inherited) $extra_ld" \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="$swift_conds" \
              build > ../build.log 2>&1
          }
          linked=false
          status=0
          if [ "${FEX_OK:-false}" = "true" ]; then
            echo "building with FEX linked"
            if build_app true; then
              linked=true
            else
              status=$?
              echo "xcodebuild with FEX FAILED (status $status); errors:"
              grep -E 'error:|Undefined symbol|duplicate symbol|referenced from' ../build.log | head -80 || true
              cp ../build.log ../build-with-fex.log
              echo "retrying without FEX"
              status=0
              build_app false || status=$?
            fi
          else
            echo "FEX not linked (see fex-build.log)"
            build_app false || status=$?
          fi
          echo "xcodebuild exit status: $status (fex linked: $linked)"
          echo "linked=$linked" >> "$GITHUB_OUTPUT"
          grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' ../build.log | grep -v 'note:' | head -200 || true
          if [ "$status" -ne 0 ]; then echo '--- last 150 lines ---'; tail -150 ../build.log; fi
          exit "$status"

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP=$(find app/build/Build/Products/Release-appletvos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          # The unsigned .app keeps the entitlements file next to it for the
          # signer; atvloadly/AltServer add get-task-allow from the profile.
          cp app/RLtvOS.entitlements "$APP/../RLtvOS.entitlements" || true
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry app.ipa Payload
          # dSYM for symbolicating /crash output offline
          DSYM=$(find app/build/Build/Products/Release-appletvos -maxdepth 1 -name '*.dSYM' -print -quit)
          if [ -n "$DSYM" ]; then (cd "$(dirname "$DSYM")" && zip -qry "$GITHUB_WORKSPACE/app.dSYM.zip" "$(basename "$DSYM")"); fi
          ls -la app.ipa app.dSYM.zip || true
          unzip -l app.ipa | head -40
          plutil -p "Payload/$(basename "$APP")/Info.plist" | grep -E 'RLBuildTag|CFBundleIdentifier|CFBundleVersion|MinimumOSVersion'
          # The JIT26 stubs must be in the main binary (the helper only needs the
          # brk instructions, but the symbols make the disassembly checkable).
          BIN="Payload/$(basename "$APP")/RLtvOS"
          nm -m "$BIN" | grep -i 'jit26' || echo "WARNING: no JIT26 symbols in the symbol table"
          otool -tv "$BIN" | grep -A3 -i 'JIT26PrepareRegion\|JIT26Detach' | head -12 || true
          echo "rlfex symbols: $(nm "$BIN" | grep -c ' T _rlfex_' || true)"
          echo "fex_built=${{ steps.fex.outputs.ok }} fex_linked=${{ steps.xcode.outputs.linked }}"
          echo "sha256: $(shasum -a 256 app.ipa)"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            fex-build.log
            build-with-fex.log
          if-no-files-found: ignore

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: ${{ env.BUILD_TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            Unsigned tvOS build of `${{ github.sha }}` (${{ github.ref_name }}).
            FEX built: `${{ steps.fex.outputs.ok }}`, FEX linked: `${{ steps.xcode.outputs.linked }}` (false = see fex-build.log / build-with-fex.log in the build-logs artifact).

            ${{ github.event.head_commit.message }}

            Install with `tools/tv.py install --tag ${{ env.BUILD_TAG }}`.
          files: |
            app.ipa
            app.dSYM.zip
          fail_on_unmatched_files: false
